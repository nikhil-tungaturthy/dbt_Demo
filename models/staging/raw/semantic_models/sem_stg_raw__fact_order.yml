semantic_models:
- name: order
  description: Order fact table at the order level. This table contains one row per
    order and includes the order date.
  model: ref('stg_raw__fact_order')
  defaults:
    agg_time_dimension: order_date
  entities:
  - name: order_id
    type: primary
    expr: order_key
  - name: customer_id
    type: foreign
    expr: customer_key
  dimensions:
  - name: order_date
    type: time
    type_params:
      time_granularity: day
  - name: status_code
    type: categorical
  - name: priority_code
    type: categorical
  - name: clerk_name
    type: categorical
  measures:
  - name: order_count
    description: The count of orders.
    agg: sum
    create_metric: true
  - name: gross_item_sales_amount
    description: The total gross sales amount of items.
    agg: sum
    create_metric: true
  - name: item_discount_amount
    description: The total discount amount on items.
    agg: sum
    create_metric: true
  - name: item_tax_amount
    description: The total tax amount on items.
    agg: sum
    create_metric: true
  - name: net_item_sales_amount
    description: The total net sales amount of items.
    agg: sum
    create_metric: true
  - name: count_order_id
    agg: count
    create_metric: true
    expr: order_key
  - name: count_customer_id
    agg: count_distinct
    create_metric: true
    expr: customer_key

metrics:
- name: total_order_count
  description: Total count of orders
  label: Total Order Count
  type: simple
  type_params:
    measure:
      name: order_count
- name: total_gross_sales
  description: Total gross sales amount of items
  label: Total Gross Sales
  type: simple
  type_params:
    measure:
      name: gross_item_sales_amount
- name: total_item_discount
  description: Total discount amount on items
  label: Total Item Discount
  type: simple
  type_params:
    measure:
      name: item_discount_amount
- name: total_item_tax
  description: Total tax amount on items
  label: Total Item Tax
  type: simple
  type_params:
    measure:
      name: item_tax_amount
- name: total_net_sales
  description: Total net sales amount of items
  label: Total Net Sales
  type: simple
  type_params:
    measure:
      name: net_item_sales_amount
- name: distinct_customer_count
  description: Count of distinct customers
  label: Distinct Customer Count
  type: simple
  type_params:
    measure:
      name: count_customer_id
- name: average_order_value
  description: Average order value calculated as total net sales divided by total
    order count
  label: Average Order Value
  type: derived
  type_params:
    expr: total_net_sales / total_order_count
    metrics:
    - name: total_net_sales
    - name: total_order_count
