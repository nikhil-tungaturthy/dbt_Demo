semantic_models:
- name: order
  description: Order fact table at the order level. This table contains one row per
    order and includes the order date.
  model: ref('stg_raw__fact_order')
  defaults:
    agg_time_dimension: order_date
  entities:
  - name: order_id
    type: primary
    expr: order_key
  - name: customer_id
    type: foreign
    expr: customer_key
  dimensions:
  - name: order_date
    type: time
    type_params:
      time_granularity: day
  - name: status_code
    type: categorical
  - name: priority_code
    type: categorical
  - name: clerk_name
    type: categorical
  measures:
  - name: order_count
    description: The count of orders.
    agg: sum
    create_metric: true
  - name: gross_item_sales_amount
    description: The total gross sales amount of items.
    agg: sum
    create_metric: true
  - name: item_discount_amount
    description: The total discount amount on items.
    agg: sum
    create_metric: true
  - name: item_tax_amount
    description: The total tax amount on items.
    agg: sum
    create_metric: true
  - name: net_item_sales_amount
    description: The total net sales amount of items.
    agg: sum
    create_metric: true
  - name: count_order_id
    agg: count
    create_metric: true
    expr: order_key
  - name: count_customer_id
    agg: count_distinct
    create_metric: true
    expr: customer_key
